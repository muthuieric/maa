version: '3.8'

# Secrets are read from the repo-root .env file (gitignored).
# First-time setup:  cp .env.example .env  &&  edit .env with a real password.
services:
  db-postgres:
    image: postgres:16-alpine
    container_name: nenoguard_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-narratives_meta}
      POSTGRES_USER: ${POSTGRES_USER:-nenoguard_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set it}
    ports:
      # Bound to loopback only — never expose the database to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nenoguard_admin} -d ${POSTGRES_DB:-narratives_meta}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-mongo:
    image: mongo:7-jammy
    container_name: nenoguard_mongo
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-narratives_db}
    ports:
      # Bound to loopback only — MongoDB runs without auth, so it must never
      # be reachable from the network.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nenoguard_api
    environment:
      POSTGRES_HOST: db-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-narratives_meta}
      POSTGRES_USER: ${POSTGRES_USER:-nenoguard_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set it}
      MONGO_URI: mongodb://db-mongo:27017/narratives_db
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - db-postgres
      - db-mongo
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nenoguard_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  mongodata:

